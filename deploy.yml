name: Yayınla (GitHub Pages)

run-name: Deploy

# Bu iş akışı, GitHub'ın otomatik "pages build and deployment" işinin yerine
# geçer. Aradaki KRİTİK fark aşağıdaki "concurrency" bloğudur:
# arka arkaya commit atıldığında eski dağıtımlar SIRAYA GİRMEK yerine iptal
# edilir. Sıraya girdiklerinde birbirlerini kilitleyip "Deployment cancelled"
# hatası veriyor ve hiçbiri tamamlanamıyordu.
#
# KURULUM: Repo → Settings → Pages → Source → "GitHub Actions" seç.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true      # yeni push gelince eskisini iptal et, sıraya alma

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages'i hazırla
        uses: actions/configure-pages@v5

      - name: Dosyaları paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
