# Netlify yapılandırması — Lumira · Dil Kartları
# .well-known klasörünün doğru içerik tipiyle sunulmasını garantiler.

[build]
  publish = "."

[[headers]]
  for = "/app-version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Service Worker asla önbelleğe alınmasın: güncellemeler anında insin
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/vendor/bergamot-0.4.9/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# /privacy → /privacy/ (sondaki eğik çizgi olmadan da açılsın)
[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

# Eski tekil dosya adıyla gelenler de doğru sayfaya gitsin
[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301

# Kaynak kodu, testler, kurulum notları ve büyük iç dosyalar sitede yayınlanmasın.
# Fonksiyonlar /.netlify/functions/ altından çalışmaya devam eder; bu kurallar
# yalnızca deponun ham dosyalarının indirilmesini engeller (bant genişliği de korunur).
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
