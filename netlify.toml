# Netlify yapılandırması — Lumira · Dil Kartları
# .well-known klasörünün doğru içerik tipiyle sunulmasını garantiler.

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Service Worker önbelleğe alınmasın.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /privacy → /privacy/
[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

# Eski gizlilik sayfası adresini yönlendir.
[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301

# Firebase Admin paketinin özgün modül yapısını koru.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[build.environment]
  NODE_VERSION = "22"
