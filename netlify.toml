# Keep Firebase Admin's module structure intact in the function bundle.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[build.environment]
  NODE_VERSION = "22"
  # Public Firebase web client identifier; all other secret scanning stays on.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBHgCtHuIunwlleLCxFCexErrjyZkuNYE0"
